[in]

sql = """
SELECT customer_id, total_amount AS order_amount, NULL AS x
FROM orders

UNION

SELECT customer_id, historical_amount AS order_amount, NULL AS x
FROM archived_orders

UNION

SELECT
    tbl3.joined_attr,
    aliased_quer.tst,
    aliased_quer.tst AS x
FROM (
    SELECT id, tst FROM a
    UNION
    SELECT id, tst2 FROM b
) AS aliased_quer
INNER JOIN tbl3 ON aliased_quer.id = tbl3.id
"""

[collapse_1]

description = "Nested UNION - inner branches converge by position; subquery branches stitch into the alias"

