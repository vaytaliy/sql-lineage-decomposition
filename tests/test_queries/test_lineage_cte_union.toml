[in]

sql = """
WITH all_tx AS (
    SELECT customer_id, amount FROM active_orders
    UNION ALL
    SELECT customer_id, amount FROM archived_orders
)
SELECT all_tx.customer_id, all_tx.amount
FROM all_tx
"""

